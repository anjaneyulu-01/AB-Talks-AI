<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runs before first paint. React mounts after paint, so applying the
      // theme in an effect would show every dark-mode user a white flash on
      // load. This decides the class; the ThemeProvider adopts it rather than
      // re-deciding, so there is no second repaint either.
      (function () {
        try {
          var stored = localStorage.getItem('abtalks-theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          // Storage blocked. Fall back to dark, which suits the product's
          // most common usage time.
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <!--
      `viewport-fit=cover` is required for `env(safe-area-inset-*)` to return
      anything other than 0. Without it the composer's safe-area padding is a
      no-op and the send button sits under the iPhone home indicator.

      Deliberately no `maximum-scale` or `user-scalable=no`: blocking pinch-zoom
      is an accessibility failure, and the 16px input rule already prevents the
      unwanted auto-zoom that people usually reach for those to suppress.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>ABTalks · Interview Intelligence</title>
    <meta
      name="description"
      content="Adaptive AI technical interviews grounded in your actual ABTalks cohort record. Find out whether you're interview-ready — before it counts."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230a0a0f'/><path d='M28 68 L50 30 L72 68' stroke='%236366f1' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/><line x1='38' y1='56' x2='62' y2='56' stroke='%2322d3ee' stroke-width='9' stroke-linecap='round'/></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
