<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="ABTalks Interview Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- ground + soft colour pools + dot grid -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="300" fill="#6366F1" opacity="0.12"/>
  <circle cx="1180" cy="120" r="280" fill="#22D3EE" opacity="0.10"/>
  <circle cx="900" cy="380" r="260" fill="#34D399" opacity="0.08"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <!-- logo mark: an "A" whose crossbar is a separate accent stroke -->
  <g transform="translate(80,108)">
    <rect width="96" height="96" rx="24" fill="url(#logo)" opacity="0.16"/>
    <rect width="96" height="96" rx="24" fill="none" stroke="#6366F1" stroke-opacity="0.4"/>
    <path d="M26 74 L48 26 L70 74" fill="none" stroke="#A5B4FC" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="36" y1="60" x2="60" y2="60" stroke="#22D3EE" stroke-width="8.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark + taglines -->
  <text x="210" y="132" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="-1">ABTalks Interview Intelligence</text>
  <text x="212" y="176" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#94A3B8">An AI mock interview built from your real ABTalks cohort record.</text>
  <text x="212" y="210" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="url(#brand)">Find out if you're ready — before it counts.</text>

  <!-- capability chips -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">
    <circle cx="218" cy="266" r="4" fill="#818CF8"/>
    <text x="230" y="271">Evidence-Grounded</text>
    <circle cx="405" cy="266" r="4" fill="#22D3EE"/>
    <text x="417" y="271">Adaptive Difficulty</text>
    <circle cx="600" cy="266" r="4" fill="#34D399"/>
    <text x="612" y="271">Voice-to-Voice</text>
    <circle cx="757" cy="266" r="4" fill="#FBBF24"/>
    <text x="769" y="271">Recruiter-Grade Report</text>
  </g>

  <!-- bottom brand accent bar -->
  <rect x="0" y="356" width="1280" height="4" fill="url(#brand)"/>
</svg>
